name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the module zip to (existing release or new tag)'
        required: true
        default: 'test_0.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile (vue-tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # NOTE: `npm ci` fails on this repo: package-lock.json is stale
      # (lock resolves vite@8.0.9, but package.json requires vite@^8.0.10).
      # `npm install` re-resolves versions, so it succeeds.
      - name: Install dependencies
        run: npm install

      - name: Build (vue-tsc typecheck + vite build)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

      - name: Package KernelSU module
        run: npm run package

      - name: Upload module zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: release/*.zip
          if-no-files-found: error

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  publish-release:
    name: Publish release assets
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download module zip artifact
        uses: actions/download-artifact@v4
        with:
          name: module-zip
          path: release

      - name: Find or create release, upload module zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          ZIP="$(ls release/*.zip)"
          NAME="joyose-edit-${RELEASE_TAG}.zip"
          echo "uploading $ZIP as $NAME to release $RELEASE_TAG"

          # find release by tag, or create it (prerelease) if missing
          ID="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/$RELEASE_TAG" | jq -r '.id')" || {
            echo "release $RELEASE_TAG not found — creating it"
            ID="$(curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/releases" -d "$(jq -n --arg t "$RELEASE_TAG" \
              '{tag_name: $t, target_commitish: "main", name: $t, prerelease: true}')" | jq -r '.id')"
          }

          # replace any existing asset with the same name (idempotent re-runs)
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/$ID" \
            | jq -r --arg n "$NAME" '.assets[] | select(.name == $n) | .id' \
            | while read -r AID; do
                [ -n "$AID" ] && curl -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/assets/$AID" > /dev/null
              done

          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/zip" \
            "$API/releases/$ID/assets?name=$NAME" --data-binary @"$ZIP" \
            | jq '{asset: .name, size: .size, browser_download_url}'