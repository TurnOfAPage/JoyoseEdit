name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile (vue-tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # NOTE: `npm ci` fails on this repo: package-lock.json is stale
      # (lock resolves vite@8.0.9, but package.json requires vite@^8.0.10).
      # `npm install` re-resolves versions, so it succeeds.
      - name: Install dependencies
        run: npm install

      - name: Build (vue-tsc typecheck + vite build)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

      - name: Package KernelSU module
        run: npm run package

      - name: Upload module zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: release/*.zip
          if-no-files-found: error

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test